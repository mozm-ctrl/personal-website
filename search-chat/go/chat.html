<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>联网搜索聊天</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; color: #1f2328; background: #fff; display: flex; flex-direction: column; height: 100vh; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 760px; margin: 0 auto 14px; white-space: pre-wrap; word-break: break-word; }
  .who { font-size: 12px; color: #656d76; margin-bottom: 2px; }
  .user .text { background: #f1f3f5; border-radius: 10px; padding: 8px 12px; display: inline-block; }
  .sources { font-size: 13px; color: #656d76; margin-top: 6px; white-space: normal; }
  .sources a { color: #0969da; text-decoration: none; word-break: break-all; }
  .error { color: #cf222e; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #d0d7de; max-width: 792px; width: 100%; margin: 0 auto; }
  input { flex: 1; font: inherit; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 8px; }
  button { font: inherit; padding: 8px 16px; border: 0; border-radius: 8px; background: #1f883d; color: #fff; cursor: pointer; }
  button:disabled { background: #94d3a2; cursor: default; }
  @media (prefers-color-scheme: dark) {
    body { color: #e6edf3; background: #0d1117; }
    .user .text { background: #21262d; }
    input { background: #0d1117; color: #e6edf3; border-color: #30363d; }
    form { border-color: #30363d; }
    .sources a { color: #4493f8; }
  }
</style>
</head>
<body>
<div id="log">
  <div class="msg"><div class="who">助手</div><div class="text">你好！我会先上网搜索再回答，并在最后列出来源链接。本地模型第一次回答可能要等十几秒。</div></div>
</div>
<form id="form">
  <input id="q" placeholder="输入问题，回车发送" autocomplete="off" autofocus>
  <button id="send">发送</button>
</form>
<script>
// 聊天接口的地址：页面和接口在同一个服务上时用相对路径即可
const API = "api/chat";
const history = []; // 只存问题和最终回答，每次发给服务器
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("q");
const send = document.getElementById("send");

function add(who, text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + (cls || "");
  div.innerHTML = '<div class="who"></div><div class="text"></div>';
  div.querySelector(".who").textContent = who;
  div.querySelector(".text").textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function addSources(div, data) {
  const box = document.createElement("div");
  box.className = "sources";
  if (!data.sources.length) {
    box.textContent = "📚 这次没有联网搜索（模型判断不需要）。";
  } else {
    box.append("📚 来源：");
    for (const s of data.sources) {
      const line = document.createElement("div");
      const a = document.createElement("a");
      a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = s.title;
      line.append("[" + s.n + "] ", a);
      box.appendChild(line);
    }
  }
  box.append("（用时 " + data.seconds.toFixed(1) + " 秒）");
  div.appendChild(box);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  send.disabled = true;
  add("你", question, "user");
  const wait = add("助手", "搜索、思考中……");
  try {
    const resp = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: [...history, { role: "user", content: question }] }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "HTTP " + resp.status);
    wait.querySelector(".text").textContent = data.answer;
    addSources(wait, data);
    history.push({ role: "user", content: question }, { role: "assistant", content: data.answer });
  } catch (err) {
    wait.classList.add("error");
    wait.querySelector(".text").textContent = "出错了：" + err.message;
  } finally {
    send.disabled = false;
    input.focus();
    log.scrollTop = log.scrollHeight;
  }
});
</script>
</body>
</html>
